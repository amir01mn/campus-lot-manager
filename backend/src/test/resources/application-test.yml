# Profile used by the test suite. The datasource is supplied by Testcontainers (@ServiceConnection).
app:
  jwt:
    secret: test-secret-test-secret-test-secret-0123456789
    # long enough that tests moving the clock forward a few hours keep their tokens
    expiry: PT12H
  sensors:
    api-key: test-sensor-key
  bootstrap:
    super-manager:
      email: super@test.local
      password: Test!Passw0rd
logging:
  level:
    org.testcontainers: INFO
    io.github.amir01mn.parking: DEBUG
