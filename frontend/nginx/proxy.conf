# Settings shared by every location proxied to the backend.
proxy_http_version 1.1;
proxy_set_header Connection "";
# Host with its port, so URLs the backend generates (Swagger UI's server URL) point back at this origin.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $http_host;
# The browser's call is same-origin (it comes through this server), so drop Origin: otherwise Spring's CORS check
# would reject POST/PATCH whenever the public origin isn't in APP_CORS_ALLOWED_ORIGINS.
proxy_set_header Origin "";
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
