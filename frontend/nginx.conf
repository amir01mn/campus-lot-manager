# CampusPark web server: serves the built SPA and forwards the API to the Spring Boot backend.
# Rendered by the nginx image's envsubst step: ${BACKEND_URL} comes from the environment (default in the Dockerfile).

server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json application/problem+json image/svg+xml;

# Keep the original scheme when a platform load balancer already terminated TLS in front of us.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # Container health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed build output: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The app shell must always be revalidated so a deploy is picked up immediately.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routes fall back to the app shell; other root files (favicon, theme script) revalidate.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # REST API, Swagger UI and the OpenAPI document live on the backend.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        include /etc/nginx/snippets/proxy.conf;
    }
    location /swagger-ui {
        proxy_pass ${BACKEND_URL};
        include /etc/nginx/snippets/proxy.conf;
    }
    location /v3/api-docs {
        proxy_pass ${BACKEND_URL};
        include /etc/nginx/snippets/proxy.conf;
    }
}
