version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major upgrades (Spring Boot 4, Java/Node runtimes, TypeScript 7) are done deliberately.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades (Spring Boot 4, Java/Node runtimes, TypeScript 7) are done deliberately.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    ignore:
      # Major upgrades (Spring Boot 4, Java/Node runtimes, TypeScript 7) are done deliberately.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
